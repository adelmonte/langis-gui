[package]
name = "langis-gui"
version = "0.1.4"
edition = "2024"
license = "AGPL-3.0-only"
description = "A desktop Signal client for Linux on the langis library, drawn with egui"
publish = false

[dependencies]
langis-core = { path = "../langis/crates/core" }
langis-store = { path = "../langis/crates/store" }
langis-emoji = { path = "../langis/crates/emoji" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "clipboard", "default_fonts"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Color emoji (the system's Noto Color Emoji, drawn from its bitmaps).
epaint = { version = "0.37", features = ["color_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image", "file"] }
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }
futures = "0.3"
anyhow = "1"
serde_json = "1"
tempfile = "3"
dirs = "6"
ksni = { version = "0.3.7", features = ["blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
notify-rust = "4"
signal-hook = "0.3"
libc = "0.2"
# Spell check in the composer, with the system's Hunspell dictionaries.
spellbook = "0.4"
# Text drawn into photos by the media editor.
ab_glyph = "0.2"
# Images pasted into the composer (eframe builds it already, for text).
wayland-client = { version = "0.31", features = ["system"] }
# Bringing the window forward on Wayland (winit builds it already).
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
raw-window-handle = "0.6"
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
linkify = "0.10"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

# The same vendored presage and libsignal-service-rs that langis builds
# with (see ../langis/vendor/README.md).
[patch."https://github.com/whisperfish/presage"]
presage = { path = "../langis/vendor/presage" }
presage-store-sqlite = { path = "../langis/vendor/presage-store-sqlite" }
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "../langis/vendor/libsignal-service" }
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
# No LTO: RingRTC's cubeb-sys links a prebuilt Rust static library with
# its own copy of core, and LTO makes those symbols clash at link time.
codegen-units = 1
